name: Release Drafter
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - id: release_draft
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version Update
        if: github.event_name == 'push'
        env:
          TAG_NAME: ${{ steps.release_draft.outputs.tag_name }}
          ALL: ${{ toJson(steps.release_draft.outputs) }}
        run: |
          rm deno.lock
          deno run -A main.ts set $TAG_NAME
          git config --global user.email "justin.chase@optum.com"
          git config --global user.name "Justin Chase"
          git status --short
          if [[ $(git commit -am "$TAG_NAME") ]]
          then
            git push
          else
            echo "No changes detected, skipping commit."
          fi

      - name: Dispatch binaries for draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_draft.outputs.tag_name }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          # Draft releases can have an untagged-* API tag even when Release
          # Drafter reports the planned version. Find the draft by its name.
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_id="$(jq -er --arg version "$RELEASE_TAG" \
            '[.[] | select(.draft and (.name == $version or .tag_name == $version))] |
             if length == 1 then .[0].id else error("Expected one draft for " + $version) end' \
            <<< "$releases")"
          sha="$(git rev-parse HEAD)"
          # Set both the eventual release tag and the exact source revision.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f "tag_name=${RELEASE_TAG}" -f "target_commitish=${sha}" >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=release-binaries \
            -f "client_payload[tag]=${RELEASE_TAG}" \
            -F "client_payload[release_id]=${release_id}"
          echo "Pinned draft ${RELEASE_TAG} to ${sha} and dispatched Release Binaries. Publish after that workflow succeeds." >> "$GITHUB_STEP_SUMMARY"
