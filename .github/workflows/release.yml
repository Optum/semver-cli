name: Release Drafter
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - id: release_draft
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version Update
        if: github.event_name == 'push'
        env:
          TAG_NAME: ${{ steps.release_draft.outputs.tag_name }}
          ALL: ${{ toJson(steps.release_draft.outputs) }}
        run: |
          rm deno.lock
          deno run -A main.ts set $TAG_NAME
          git config --global user.email "justin.chase@optum.com"
          git config --global user.name "Justin Chase"
          git status --short
          if [[ $(git commit -am "$TAG_NAME") ]]
          then
            git push
          else
            echo "No changes detected, skipping commit."
          fi

      - name: Dispatch binaries for draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_draft.outputs.tag_name }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          meta="$(gh release view "$RELEASE_TAG" --json databaseId,isDraft)"
          if [[ "$(jq -r .isDraft <<< "$meta")" != true ]]; then
            echo "Release $RELEASE_TAG is no longer a draft." >&2
            exit 1
          fi
          release_id="$(jq -r .databaseId <<< "$meta")"
          sha="$(git rev-parse HEAD)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f "target_commitish=${sha}" >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=release-binaries \
            -f "client_payload[tag]=${RELEASE_TAG}"
          echo "Pinned draft ${RELEASE_TAG} to ${sha} and dispatched Release Binaries. Publish after that workflow succeeds." >> "$GITHUB_STEP_SUMMARY"
